[program:sam_watchdog]
environment=PROC_NAME="%(program_name)s",STALL_MIN="45"
command=/opt/supervisor-scripts/sam_watchdog.sh
autostart=true
autorestart=true
; kill the whole process group: supervisorctl restart otherwise leaves the
; gpu-claim wrapper and trainer orphaned, and the retry spawns a DUPLICATE
; that trains concurrently into the same log and checkpoint dir (2026-08-25).
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

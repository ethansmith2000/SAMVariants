[program:sam_sweep3]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/sam_sweep3.sh
autostart=true
autorestart=unexpected
; kill the whole process group: supervisorctl restart otherwise leaves the
; gpu-claim wrapper and trainer orphaned, and the retry spawns a DUPLICATE
; that trains concurrently into the same log and checkpoint dir (2026-08-25).
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
